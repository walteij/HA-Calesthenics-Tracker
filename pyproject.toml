[project]
name = "ha-calisthenics-tracker"
version = "0.1.1"
description = "Local calisthenics tracking for Home Assistant"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.11.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
