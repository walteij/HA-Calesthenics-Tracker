# ============================================================
# Calisthenics Tracker – Example Scripts
# ============================================================
# These scripts bridge the dashboard buttons to the
# calisthenics_tracker integration services.
#
# Prerequisites:
#   - custom_components/calisthenics_tracker
#   - Hevy integration (optional, for hevy.start_workout)
#   - input_number.calisthenics_invoer_gewicht  (helper, 40–250 kg)
#   - input_number.calisthenics_invoer_taille   (helper, 50–200 cm)
# ============================================================

# ── Training A starten ────────────────────────────────────────
calisthenics_training_a_starten:
  alias: Calisthenics training A starten
  description: >-
    Start sessie A (basissterkte) in zowel de Calisthenics Tracker
    als Hevy.
  icon: mdi:arm-flex
  mode: single
  sequence:
    - action: calisthenics_tracker.start_workout
      data:
        session_type: A
    - action: hevy.start_workout
      data: {}

# ── Training B starten ────────────────────────────────────────
calisthenics_training_b_starten:
  alias: Calisthenics training B starten
  description: >-
    Start sessie B (conditie & core) in zowel de Calisthenics Tracker
    als Hevy.
  icon: mdi:run-fast
  mode: single
  sequence:
    - action: calisthenics_tracker.start_workout
      data:
        session_type: B
    - action: hevy.start_workout
      data: {}

# ── Meting opslaan ────────────────────────────────────────────
calisthenics_meting_opslaan:
  alias: Calisthenics meting opslaan
  description: >-
    Slaat gewicht en/of taille op via de Calisthenics Tracker.
    Alleen gevulde waarden worden verstuurd.
  icon: mdi:content-save
  mode: single
  sequence:
    - action: calisthenics_tracker.add_body_measurement
      data:
        weight_kg: "{{ states('input_number.calisthenics_invoer_gewicht') | float }}"
        waist_cm: "{{ states('input_number.calisthenics_invoer_taille') | float }}"
