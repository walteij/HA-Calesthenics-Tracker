calisthenics_start_workout:
  alias: Calisthenics - training starten
  description: Start een A- of B-training in de lokale tracker.
  mode: single
  fields:
    session_type:
      name: Sessietype
      required: true
      selector:
        select:
          options:
            - A
            - B
  sequence:
    - action: calisthenics_tracker.start_workout
      data:
        session_type: "{{ session_type }}"

calisthenics_complete_workout:
  alias: Calisthenics - training afronden
  description: Rond de actieve training af en sla optionele notities op.
  mode: single
  fields:
    notes:
      name: Notities
      selector:
        text:
          multiline: true
  sequence:
    - action: calisthenics_tracker.complete_workout
      data:
        notes: "{{ notes | default('') }}"

calisthenics_log_exercise:
  alias: Calisthenics - oefening loggen
  description: >-
    Registreer sets als een niet-lege lijst positieve getallen, bijvoorbeeld
    [10, 9, 8]. Een nieuwe log voor dezelfde oefening vervangt de eerdere log.
  mode: single
  fields:
    exercise_id:
      name: Oefening-ID
      required: true
      selector:
        text:
    variant:
      name: Uitgevoerde variant
      required: true
      selector:
        text:
    sets:
      name: Herhalingen per set
      description: Een lijst, bijvoorbeeld [10, 9, 8].
      required: true
      selector:
        object:
    rir:
      name: Herhalingen over (RIR)
      required: true
      selector:
        number:
          min: 0
          max: 5
          step: 1
          mode: box
    pain_score:
      name: Pijnscore
      description: Vanaf 4 toont de tracker een waarschuwing.
      required: true
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: box
    notes:
      name: Notities
      selector:
        text:
          multiline: true
  sequence:
    - action: calisthenics_tracker.log_exercise
      data:
        exercise_id: "{{ exercise_id }}"
        variant: "{{ variant }}"
        sets: "{{ sets }}"
        rir: "{{ rir | int }}"
        pain_score: "{{ pain_score | int }}"
        notes: "{{ notes | default('') }}"

calisthenics_add_body_measurement:
  alias: Calisthenics - lichaamsmeting toevoegen
  description: >-
    Sla een of meer meetwaarden op in Home Assistant. Vul minimaal één waarde
    in. De gegevens blijven lokaal.
  mode: single
  fields:
    measurement:
      name: Meetwaarden
      required: true
      selector:
        object:
          fields:
            measured_at:
              label: Meetmoment (optioneel, ISO 8601 met tijdzone)
              selector:
                text:
            weight_kg:
              label: Gewicht (kg)
              selector:
                number:
                  min: 0.1
                  max: 500
                  step: 0.1
                  mode: box
            waist_cm:
              label: Middelomtrek (cm)
              selector:
                number:
                  min: 0.1
                  max: 300
                  step: 0.1
                  mode: box
            resting_heart_rate:
              label: Rusthartslag (bpm)
              selector:
                number:
                  min: 1
                  max: 300
                  step: 1
                  mode: box
            steps:
              label: Stappen
              selector:
                number:
                  min: 0
                  step: 1
                  mode: box
            sleep_hours:
              label: Slaap (uren)
              selector:
                number:
                  min: 0
                  max: 24
                  step: 0.1
                  mode: box
            calorie_intake:
              label: Calorie-inname
              selector:
                number:
                  min: 0
                  step: 1
                  mode: box
            protein_grams:
              label: Eiwit (gram)
              selector:
                number:
                  min: 0
                  step: 1
                  mode: box
            notes:
              label: Notities
              selector:
                text:
                  multiline: true
  sequence:
    - action: calisthenics_tracker.add_body_measurement
      data: "{{ measurement }}"
